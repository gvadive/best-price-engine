events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format upstream_log '$remote_addr - [$time_local] "$request" $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    upstream pricing_engine {
        server pricing-engine-1:8082;
        server pricing-engine-2:8082;
    }

    server {
        listen 80;

        location /api/compare {
            proxy_pass http://pricing_engine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ingestion's own API, exposed through the same origin: catalog data,
        # order placement, bulk pricing requests, and price watch orders all
        # live there.
        location ~ ^/api/(offers|orders|bulk-pricing-requests|price-watch-orders) {
            proxy_pass http://ingestion-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
