name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build both Spring services
        run: ./gradlew build -x test

      - name: Install Python test dependencies
        run: pip install pytest pytest-playwright requests

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run BestOfferSelector unit tests
        run: |
          cd ingestion-service/lambda
          pytest -v

      - name: Run API + resiliency tests (starts both services itself, isolated ports)
        run: |
          cd tests
          pytest -v

      - name: Build Docker images
        run: |
          docker compose build ingestion-service pricing-engine-1 pricing-engine-2

      - name: Start the real stack (nginx + load-balanced services)
        run: docker compose up -d ingestion-service pricing-engine-1 pricing-engine-2 nginx

      - name: Wait for nginx and the backend services to be reachable
        run: |
          wait_for() {
            local url="$1" label="$2"
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              [ "$code" = "200" ] && echo "$label ready after ${i}s" && return 0
              sleep 2
            done
            echo "$label never became reachable" && return 1
          }
          # Tests seed data by calling ingestion-service directly (bypassing
          # nginx), so it must be genuinely ready, not just nginx itself --
          # nginx serves the static frontend fine before its Java backend
          # has finished booting, which was the actual cause of the last
          # CI failure (502s / connection resets on the seeding calls).
          wait_for "http://localhost:8081/api/offers?product=warmup" "ingestion-service" || exit 1
          wait_for "http://localhost:8080/" "nginx" || exit 1

      - name: Run Playwright E2E (against the real nginx-fronted stack)
        run: |
          cd frontend
          pytest test_compare_flow.py test_order_actions_flow.py -v --browser chromium

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  ec2-smoketest:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write SSH private key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/best-price-engine-ci.pem
          chmod 600 /tmp/best-price-engine-ci.pem

      - name: Ensure rsync is available
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Launch ephemeral EC2 instance, deploy, smoke-test, tear down
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bash infra/aws/deploy-ci-smoketest.sh
