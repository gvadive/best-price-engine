name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      keep_ec2:
        description: "Leave the smoke-test EC2 instance running instead of auto-terminating (terminate it yourself when done -- it costs money while up)"
        type: boolean
        default: false

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          cd bpe-frontend
          npm ci

      - name: Build both Spring services
        run: ./gradlew build -x test

      - name: Install Python test dependencies
        run: pip install pytest pytest-playwright requests

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run BestOfferSelector unit tests
        run: |
          cd ingestion-service/lambda
          pytest -v

      - name: Run API + resiliency tests (starts both services itself, isolated ports)
        run: |
          cd tests
          pytest -v

      - name: Build Docker images
        run: |
          docker compose build ingestion-service pricing-engine-1 pricing-engine-2 nginx

      - name: Start the real stack (nginx + load-balanced services)
        run: docker compose up -d ingestion-service pricing-engine-1 pricing-engine-2 nginx

      - name: Wait for nginx and the backend services to be reachable
        run: |
          wait_for() {
            local url="$1" label="$2"
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              [ "$code" = "200" ] && echo "$label ready after ${i}s" && return 0
              sleep 2
            done
            echo "$label never became reachable" && return 1
          }
          # Tests seed data by calling ingestion-service directly (bypassing
          # nginx), so it must be genuinely ready, not just nginx itself --
          # nginx serves the static frontend fine before its Java backend
          # has finished booting, which was the actual cause of the last
          # CI failure (502s / connection resets on the seeding calls).
          wait_for "http://localhost:8081/api/offers?product=warmup" "ingestion-service" || exit 1
          wait_for "http://localhost:8082/v3/api-docs" "pricing-engine-1" || exit 1
          wait_for "http://localhost:8080/" "nginx" || exit 1

      - name: Check generated OpenAPI client is up to date
        run: |
          cd bpe-frontend
          PRICING_ENGINE_OPENAPI_URL=http://localhost:8082/v3/api-docs npm run generate-client
          if ! git diff --exit-code --quiet -- src/generated-client; then
            echo "::error::src/generated-client is stale relative to pricing-engine-service's live OpenAPI spec."
            echo "Run 'npm run generate-client' in bpe-frontend and commit the result."
            git diff -- src/generated-client
            exit 1
          fi

      - name: Run Playwright E2E (against the real nginx-fronted stack)
        run: |
          cd frontend
          pytest test_compare_flow.py test_order_actions_flow.py -v --browser chromium

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # Builds both Spring images once, here, on the GitHub Actions runner (real RAM,
  # not the ephemeral t3.micro), and pushes to ghcr.io. ghcr.io is deliberate over
  # AWS ECR: GitHub Actions' own GITHUB_TOKEN already has registry-push rights for
  # packages owned by this repo, so this needs zero new AWS IAM permission --
  # avoiding the self-escalation/Console-step friction that recurred repeatedly
  # when adding the original EC2-hosting IAM policy.
  build-and-push:
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ingestion-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ingestion-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/best-price-engine-ingestion:latest
            ghcr.io/${{ github.repository_owner }}/best-price-engine-ingestion:${{ github.sha }}

      - name: Build and push pricing-engine-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pricing-engine-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/best-price-engine-pricing:latest
            ghcr.io/${{ github.repository_owner }}/best-price-engine-pricing:${{ github.sha }}

      - name: Build and push frontend (React build -> nginx serve)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bpe-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/best-price-engine-frontend:latest
            ghcr.io/${{ github.repository_owner }}/best-price-engine-frontend:${{ github.sha }}

  ec2-smoketest:
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write SSH private key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/best-price-engine-ci.pem
          chmod 600 /tmp/best-price-engine-ci.pem

      - name: Ensure rsync is available
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Launch ephemeral EC2 instance, deploy, smoke-test, tear down (unless keep_ec2)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.keep_ec2 }}" = "true" ]; then
            bash infra/aws/deploy-ci-smoketest.sh --keep
          else
            bash infra/aws/deploy-ci-smoketest.sh
          fi
