name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build both Spring services
        run: ./gradlew build -x test

      - name: Install Python test dependencies
        run: pip install pytest pytest-playwright requests

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run BestOfferSelector unit tests
        run: |
          cd ingestion-service/lambda
          pytest -v

      - name: Run API + resiliency tests (starts both services itself, isolated ports)
        run: |
          cd tests
          pytest -v

      - name: Build Docker images
        run: |
          docker compose build ingestion-service pricing-engine-1 pricing-engine-2

      - name: Start the real stack (nginx + load-balanced services)
        run: docker compose up -d ingestion-service pricing-engine-1 pricing-engine-2 nginx

      - name: Wait for nginx to be reachable
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "nginx never became reachable" && exit 1

      - name: Run Playwright E2E (against the real nginx-fronted stack)
        run: |
          cd frontend
          pytest test_compare_flow.py test_order_actions_flow.py -v --browser chromium

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
