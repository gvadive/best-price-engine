<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Best Price Engine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Best Price Engine</h1>
    <p class="subtitle">Compare dummy-retailer offers for a product under your own criteria.</p>

    <form id="compare-form">
      <label>
        Product
        <input type="text" id="product" name="product" value="USB Cable" required />
      </label>
      <label>
        Quantity
        <input type="number" id="quantity" name="quantity" value="1" min="1" required />
      </label>
      <label>
        Max delivery days (optional)
        <input type="number" id="maxDeliveryDays" name="maxDeliveryDays" min="0" />
      </label>
      <label>
        Min rating (optional)
        <input type="number" id="minRating" name="minRating" min="0" max="5" step="0.1" />
      </label>
      <label>
        Strategy
        <select id="strategy" name="strategy">
          <option value="TOTAL_COST">Cheapest total for this quantity</option>
          <option value="UNIT_PRICE">Cheapest per unit</option>
        </select>
      </label>
      <button type="submit">Compare</button>
    </form>

    <p id="status" role="status"></p>

    <table id="results" hidden>
      <thead>
        <tr>
          <th>Retailer</th>
          <th>Unit price</th>
          <th>Total for quantity</th>
          <th>Delivery days</th>
          <th>Rating</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>

    <section id="action-panel" hidden>
      <h2 id="action-panel-title"></h2>

      <div id="order-fields">
        <label>
          Quantity
          <input id="order-quantity" type="number" value="1" min="1" />
        </label>
        <label>
          Fulfillment
          <select id="order-fulfillment-mode">
            <option value="EXACT_QUANTITY">Exact quantity only</option>
            <option value="BEST_EFFORT">Best effort (partial OK)</option>
          </select>
        </label>
        <button id="submit-order">Place Order</button>
      </div>

      <div id="bulk-fields" hidden>
        <label>
          Requested quantity (bulk)
          <input id="bulk-quantity" type="number" value="100" min="1" />
        </label>
        <button id="submit-bulk-request">Request Bulk Pricing</button>
        <div id="bulk-result"></div>
        <button id="submit-order-from-bulk" hidden>Place Order at Negotiated Price</button>
      </div>

      <div id="watch-fields" hidden>
        <label>
          Quantity
          <input id="watch-quantity" type="number" value="1" min="1" />
        </label>
        <label>
          Max acceptable price
          <input id="watch-max-price" type="number" step="0.01" />
        </label>
        <label>
          Fulfillment
          <select id="watch-fulfillment-mode">
            <option value="EXACT_QUANTITY">Exact quantity only</option>
            <option value="BEST_EFFORT">Best effort (partial OK)</option>
          </select>
        </label>
        <label>
          Expires after (seconds)
          <input id="watch-expires-after" type="number" value="86400" />
        </label>
        <button id="submit-price-watch">Create Price Watch Order</button>
      </div>

      <div id="action-result" role="status"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
