services:
  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    ports:
      - "8081:8081"

  pricing-engine-1:
    build:
      context: .
      dockerfile: pricing-engine-service/Dockerfile
    environment:
      INGESTION_BASE_URL: http://ingestion-service:8081
    ports:
      - "8082:8082"
    depends_on:
      - ingestion-service

  pricing-engine-2:
    build:
      context: .
      dockerfile: pricing-engine-service/Dockerfile
    environment:
      INGESTION_BASE_URL: http://ingestion-service:8081
    ports:
      - "8092:8082"
    depends_on:
      - ingestion-service

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - pricing-engine-1
      - pricing-engine-2
      - ingestion-service

  # Self-hosted artifact repository -- ./gradlew publish targets this instead
  # of a paid/hosted service, demonstrating the Gradle -> Nexus -> Docker
  # pipeline end to end without any external dependency.
  nexus:
    image: sonatype/nexus3:3.70.1
    ports:
      - "8083:8081"
    volumes:
      - nexus-data:/nexus-data

  # AWS emulated locally -- S3 + Lambda + Step Functions for the async
  # catalog-ingestion pipeline. Real AWS deploy is a separate, later step.
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,lambda,stepfunctions,iam,dynamodb,logs
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:

volumes:
  nexus-data:
